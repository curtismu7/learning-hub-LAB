# OrbStack:  docker compose up --build -d   ->  http://127.0.0.1:4600/api/health
# The hub binds 0.0.0.0 INSIDE the container (the Dockerfile sets it) but the port is published on loopback only.
# Read-only filesystem, no host mounts, no docker socket. Do not change the 127.0.0.1 below.
name: learning-hub

services:
  learning-hub:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-4600}:4600"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4600/api/health',{headers:{host:'127.0.0.1'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
